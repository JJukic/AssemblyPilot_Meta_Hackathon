[project]
name = "assemblypilot-backend"
version = "0.1.0"
description = "AssemblyPilot image validation and future Meta inference API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pillow>=11,<13",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "sqlmodel>=0.0.24,<0.1",
  "sqlalchemy>=2.0,<2.1",
  "meta-sam-parser==0.1.0",
  "opencv-contrib-python-headless>=4.11,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
